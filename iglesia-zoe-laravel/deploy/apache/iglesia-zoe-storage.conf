# Uploaded files under /storage are data only: never run them as scripts.
# Install: copy to /etc/apache2/conf-available/, then `a2enconf iglesia-zoe-storage && systemctl reload apache2`.
<Directory /opt/iglesia-zoe-app/storage/app/public>
    Options -ExecCGI -Indexes +FollowSymLinks
    AllowOverride None
    <FilesMatch "\.(php|phar|phtml|php\d|pht|cgi|pl|py|sh)$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /opt/iglesia-zoe-app/public/storage>
    <FilesMatch "\.(php|phar|phtml|php\d|pht|cgi|pl|py|sh)$">
        Require all denied
    </FilesMatch>
</Directory>
